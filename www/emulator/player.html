<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XPLAY Emulador</title>
<!-- shim do XPLAY: PS/Share+Options = menu, segurar PS/Voltar = sair, congela loop/áudio com o menu aberto -->
<script data-cfasync="false" src="../xplay-shim.js"></script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
#game{position:fixed;inset:0;width:100%;height:100%}
/* sem barra do EmulatorJS: no XPLAY tudo é controlado pelo controle e pelo menu do próprio XPLAY */
.ejs_menu_bar,.ejs_virtual_gamepad,.ejs_context_menu{display:none!important}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#fff;font:700 22px sans-serif;padding:8%;background:#05070d}
</style></head><body>
<div id="game"></div><div id="err"></div>
<script data-cfasync="false">
(function(){
var q=new URLSearchParams(location.search),rom=q.get('rom')||'',core=q.get('core')||'snes',name=q.get('name')||'Jogo';
function fail(m){var e=document.getElementById('err');e.textContent=m;e.style.display='flex'}
/* só aceita ROMs da pasta /roms do próprio XPLAY (nada de URL externa) */
if(!/^\.\.\/roms\/[A-Za-z0-9_\-\/. ]+$/.test(rom)||rom.indexOf('..',3)>=0){fail('ROM inválida ou não informada.');return}
if(!/^[a-z0-9_]+$/.test(core)){fail('Núcleo inválido.');return}
window.EJS_player='#game';
window.EJS_core=core;
window.EJS_gameUrl=rom;
window.EJS_gameName=name.slice(0,60);
window.EJS_pathtodata='data/';
window.EJS_language='pt-BR';
window.EJS_color='#22e6ff';
window.EJS_startOnLoaded=true;                 /* sem tela "Start Game": nada para clicar */
window.EJS_defaultOptions={'virtual-gamepad':'disabled'};   /* navegador de TV às vezes se diz "mobile" */
window.EJS_disableDatabases=false;             /* mantém save states/SRAM no IndexedDB do aparelho */
window.EJS_Buttons={playPause:false,restart:false,mute:false,settings:false,fullscreen:false,enterFullscreen:false,exitFullscreen:false,saveState:false,loadState:false,screenRecord:false,gamepad:false,cheat:false,volume:false,saveSavFiles:false,loadSavFiles:false,quickSave:false,quickLoad:false,screenshot:false,cacheManager:false,exitEmulation:false,netplay:false,diskButton:false,contextMenuButton:false};
window.addEventListener('error',function(e){if(/EJS|Emulator|wasm/i.test(String(e.message)))fail('Falha ao iniciar o emulador.')});
var s=document.createElement('script');s.src='data/loader.js';s.onerror=function(){fail('Emulador não encontrado (emulator/data).')};document.body.appendChild(s);
/* foco no iframe para o controle funcionar sem clique */
addEventListener('load',function(){try{window.focus()}catch(e){}});
})();
</script></body></html>
